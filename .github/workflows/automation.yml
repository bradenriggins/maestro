name: Automation

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.go'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/automation.yml'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.go'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/automation.yml'
      - 'README.md'

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq

      - name: Run automated validation harness
        run: make ci
